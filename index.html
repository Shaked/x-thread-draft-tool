<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Sets the theme before the first paint: light unless the saved choice says otherwise. -->
    <script>
      try {
        var t = localStorage.getItem('xt-theme');
        if (t === 'light' || t === 'dark' || t === 'system') document.documentElement.dataset.theme = t;
        else document.documentElement.dataset.theme = 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>X Thread Draft Tool</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
