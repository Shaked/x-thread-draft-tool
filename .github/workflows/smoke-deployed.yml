name: Smoke test (deployed)

# Runs the smoke test against a deployed URL after a successful Vercel deployment, and on demand.
# Needs the XT_SMOKE_TOKEN secret (an API token for the owner's account). Without it, the run
# is skipped with a notice, not failed.
#
# Optional secret VERCEL_AUTOMATION_BYPASS_SECRET is sent as x-vercel-protection-bypass if
# Deployment Protection is enabled on previews.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test, e.g. https://x-thread-draft-tool-preview.vercel.app'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-deployed-${{ github.event.deployment_status.environment_url || inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test
    # Only successful deployments (or manual runs) continue.
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      XT_SMOKE_TOKEN: ${{ secrets.XT_SMOKE_TOKEN }}
      XT_SMOKE_TOKEN_PRODUCTION: ${{ secrets.XT_SMOKE_TOKEN_PRODUCTION }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url }}
    steps:
      - name: Check for the token secret
        id: gate
        run: |
          if [ -z "${XT_SMOKE_TOKEN:-}" ]; then
            echo "::notice::XT_SMOKE_TOKEN is not set; skipping the deployed smoke test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Run the smoke test
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ]; then echo "::error::No base URL"; exit 1; fi
          # Production has its own database, so it needs its own token.
          if [ "$BASE_URL" = "https://x-thread-draft-tool.vercel.app" ]; then
            token="${XT_SMOKE_TOKEN_PRODUCTION:-}"
            if [ -z "$token" ]; then echo "::error::XT_SMOKE_TOKEN_PRODUCTION is not set"; exit 1; fi
          else
            token="${XT_SMOKE_TOKEN:-}"
          fi
          XT_TOKEN="$token" XT_BASE_URL="$BASE_URL" npm run smoke
