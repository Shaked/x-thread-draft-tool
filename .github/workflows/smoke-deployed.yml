name: Smoke test (deployed)

# Runs the smoke test against a deployed URL after a successful Vercel deployment, and on demand.
# The job signs in with a short-lived GitHub OIDC identity token for the deployment's audience.
# The server accepts it only from this repository and this workflow file (server/oidc-ci.js).
# No long-lived token is stored: the XT_SMOKE_TOKEN* secrets were removed in hardening Task 27 (D-9).
# Preview and production deployments both get the full test.
#
# Optional secret VERCEL_AUTOMATION_BYPASS_SECRET is sent as x-vercel-protection-bypass if
# Deployment Protection is enabled on previews.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test, e.g. https://x-thread-draft-tool-preview.vercel.app'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-deployed-${{ github.event.deployment_status.environment_url || inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test
    # Only successful deployments (or manual runs) continue.
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url }}
      DEPLOY_ENV: ${{ github.event.deployment.environment || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the smoke test
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ]; then echo "::error::No base URL"; exit 1; fi
          # The production environment name or the production domain selects the production audience.
          if [ "$DEPLOY_ENV" = "Production" ] || [ "$BASE_URL" = "https://x-thread-draft-tool.vercel.app" ]; then
            AUD=x-thread-draft-tool-ci-production
          else
            AUD=x-thread-draft-tool-ci-preview
          fi
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r '.value')
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then echo "::error::could not get a GitHub OIDC token"; exit 1; fi
          echo "::add-mask::$oidc"
          echo "auth: OIDC"
          XT_EXPECT_AUTH=ci-oidc XT_TOKEN="$oidc" XT_BASE_URL="$BASE_URL" npm run smoke
