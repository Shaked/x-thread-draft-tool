name: Smoke test (deployed)

# Runs the smoke test against a deployed URL after a successful Vercel deployment, and on demand.
# The job signs in with a short-lived GitHub OIDC identity token for the deployment's audience.
# The server accepts it only from this repository and this workflow file (server/oidc-ci.js).
# No long-lived token is stored: the old smoke-token secrets were removed in hardening Task 27 (D-9).
# Preview and production deployments both get the full test.
#
# Optional secret VERCEL_AUTOMATION_BYPASS_SECRET is sent as x-vercel-protection-bypass if
# Deployment Protection is enabled on previews.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test, e.g. https://x-thread-draft-tool-preview.vercel.app'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-deployed-${{ github.event.deployment_status.environment_url || inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test
    # Only successful deployments (or manual runs) continue.
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url }}
      DEPLOY_ENV: ${{ github.event.deployment.environment || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the smoke test
        id: smoke
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ]; then echo "::error::No base URL"; exit 1; fi
          # The production environment name or the production domain selects the production audience.
          if [ "$DEPLOY_ENV" = "Production" ] || [ "$BASE_URL" = "https://x-thread-draft-tool.vercel.app" ]; then
            AUD=x-thread-draft-tool-ci-production
          else
            AUD=x-thread-draft-tool-ci-preview
          fi
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r '.value')
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then echo "::error::could not get a GitHub OIDC token"; exit 1; fi
          echo "::add-mask::$oidc"
          echo "auth: OIDC"
          XT_EXPECT_AUTH=ci-oidc XT_TOKEN="$oidc" XT_BASE_URL="$BASE_URL" npm run smoke

      # Telegram notices for production only (epic #241). Both steps run even when the smoke step
      # failed, never fail the job (continue-on-error), and send nothing without the two secrets.
      # The commit title and sha come in through env, never through ${{ }} inside run.
      - name: "Telegram: production is live and tested"
        if: always() && github.event_name == 'deployment_status' && github.event.deployment.environment == 'Production' && steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          PROD_URL: https://x-thread-draft-tool.vercel.app
        run: |
          short="${DEPLOY_SHA:0:7}"
          title="$(git log -1 --format=%s "$DEPLOY_SHA" 2>/dev/null)"
          title="${title:-(title not found)}"
          NOTIFY_TEXT="Production is live and tested: ${short} ${title}. Smoke tests passed. ${PROD_URL}" node scripts/notify-telegram.mjs

      - name: "Telegram: production smoke failed"
        if: always() && github.event_name == 'deployment_status' && github.event.deployment.environment == 'Production' && steps.smoke.outcome != 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short="${DEPLOY_SHA:0:7}"
          title="$(git log -1 --format=%s "$DEPLOY_SHA" 2>/dev/null)"
          title="${title:-(title not found)}"
          NOTIFY_TEXT="PRODUCTION SMOKE FAILED: ${short} ${title}. Run: ${RUN_URL}" node scripts/notify-telegram.mjs
