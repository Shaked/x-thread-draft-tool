name: Metrics daily

# Central metrics plan (#439), task M3 (#449); epic #407. Every 6 hours scripts/ops-emit.mjs reads CI runs,
# merges, deployments and speed stages from the GitHub API and posts them to POST /api/ops/events (M2).
# The route accepts only this file's OIDC token on main (server/oidc-ci.js). The `daily` job (O5, #336) calls
# POST /api/ops/metrics-daily with its own audience: it writes yesterday's product row, moves old hourly rows and
# deletes metric rows past retention (events 14 days, counters 400 days). Re-runs started more than 3 days after the run are not collected.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pull-requests: read
  id-token: write

# One run at a time: two collections must not write the same day's counters together.
concurrency:
  group: metrics-daily
  cancel-in-progress: false

jobs:
  emit:
    name: Ops events
    # A hand-started run on another branch would read everything and then be refused at the POST: main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # No `npm ci`: scripts/ops-emit.mjs imports only node: modules, scripts/speed-metrics.mjs and server/ops/sources.js.
      - name: Collect and post the ops events
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ops-emit.mjs

  daily:
    name: Daily step
    # O5 (#336): the daily rollup and retention. Its own audience, so the emit token never passes on this route.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O7 (#338): the alerts that are new this run, as JSON, for the `alerts` job. Counts and plain words only.
    outputs:
      alerts: ${{ steps.daily.outputs.alerts }}
    # Job-level permissions replace the workflow's: this job needs only the OIDC token and read access to the code.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The token is requested for the daily audience and passed in a header only; the response is counts.
      - name: Run the daily step
        id: daily
        env:
          OPS_BASE_URL: https://x-thread-draft-tool.vercel.app
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=x-thread-draft-tool-ops-daily-production" | jq -er '.value')"
          echo "::add-mask::${token}"
          result="$(curl -fsS -X POST -H "Authorization: Bearer ${token}" "${OPS_BASE_URL}/api/ops/metrics-daily")"
          jq -c . <<<"${result}"
          echo "alerts=$(jq -c '.alerts // []' <<<"${result}")" >> "${GITHUB_OUTPUT}"

  # O7 (#338): one Telegram message per alert that is new. A separate job, so the job that holds the OIDC token
  # holds no secret. Every value goes in through the environment, never inside the shell text.
  alerts:
    name: Telegram alerts
    needs: daily
    if: github.ref == 'refs/heads/main' && needs.daily.outputs.alerts != '' && needs.daily.outputs.alerts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Send one message per new alert
        env:
          ALERTS: ${{ needs.daily.outputs.alerts }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_KIND: metrics
        run: |
          set -euo pipefail
          while IFS= read -r alert; do
            NOTIFY_HEADLINE="$(jq -r '.headline' <<<"${alert}")" \
            NOTIFY_NUMBER_LINE="$(jq -r '.numberLine' <<<"${alert}")" \
            NOTIFY_CAUSE_LINE="$(jq -r '.causeLine' <<<"${alert}")" \
            NOTIFY_ACTION_LINE="$(jq -r '.actionLine' <<<"${alert}")" \
            node scripts/notify-telegram.mjs
          done < <(jq -c '.[]' <<<"${ALERTS}")
