name: MCP real-client logins

# Runs the real Claude Code and Codex CLI OAuth logins against a local connector, with no person.
# GitHub-hosted runners can reach the client metadata hosts (claude.ai, chatgpt.com), which the
# connector fetches during login. The binaries are pinned to the versions the tests were written for.

on:
  pull_request:
    paths:
      - 'server/oauth/**'
      - 'server/mcp/**'
      - 'server/routes/oauth.js'
      - 'tests/clients/**'
      - 'scripts/dev-api.mjs'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned clients
        run: npm install -g @anthropic-ai/claude-code@2.1.323 @openai/codex@0.169.0
      - name: Real-client login tests
        env:
          XT_CODEX: codex
        run: npm run test:clients
