name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (ESLint gate)
        run: npm run lint

      - name: Unused code (knip)
        run: npm run knip

      - name: Slop scan
        run: npm run slop
      - name: Duplicate code (jscpd)
        run: npm run dup

      # Reject any migration that contains a destructive statement (same patterns as the
      # former Supabase deploy guard). Destructive changes need a deliberate, reviewed rewrite.
      - name: Lint database migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(db/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations found, nothing to lint."
            exit 0
          fi

          patterns=(
            'drop[[:space:]]+table'
            'drop[[:space:]]+schema'
            'drop[[:space:]]+database'
            'drop[[:space:]]+column'
            'drop[[:space:]]+role'
            'drop[[:space:]]+policy'
            'truncate[[:space:]]'
            'alter[[:space:]]+table[[:space:]]+[^;]*drop[[:space:]]'
            'delete[[:space:]]+from'
          )

          fail=0
          for f in "${files[@]}"; do
            for p in "${patterns[@]}"; do
              if grep -inE "$p" "$f" >/dev/null; then
                echo "::error file=$f::Destructive pattern matched: $p"
                grep -inE "$p" "$f" || true
                fail=1
              fi
            done
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::Migration lint failed. Destructive operations are blocked by policy."
            exit 1
          fi

      - name: Run unit tests
        run: npm run test:unit

  smoke-local:
    name: Smoke test against the local API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the local headless API
        run: |
          npm run dev:api > dev-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "::error::Local API did not start"; cat dev-api.log; exit 1

      - name: Run the smoke test
        run: |
          set -euo pipefail
          token=$(curl -fsS -X POST http://127.0.0.1:8787/api/dev/token \
            -H 'content-type: application/json' -d '{"login":"ci-smoke"}' | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).token")
          echo "::add-mask::$token"
          XT_BASE_URL=http://127.0.0.1:8787 XT_TOKEN="$token" npm run smoke

  e2e:
    name: E2E tests (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

  screens:
    name: UI screenshots (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app and start the local servers
        run: |
          npm run build
          npm run dev:api > api.log 2>&1 &
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && curl -sf -o /dev/null -XPOST http://127.0.0.1:4173/api/dev/token -H 'content-type: application/json' -d '{"login":"ci-probe"}' && break
            sleep 1
          done

      - name: Capture screens
        env:
          XT_BASE_URL: http://127.0.0.1:4173
        run: npm run screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: test-results/screens
