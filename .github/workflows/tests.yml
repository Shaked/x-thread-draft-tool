name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (build, lint, knip, slop, jscpd, migration lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (ESLint gate)
        run: npm run lint

      - name: Unused code (knip)
        run: npm run knip

      - name: Slop scan
        run: npm run slop
      - name: Duplicate code (jscpd)
        run: npm run dup

      # Reject any migration that contains a destructive statement (same patterns as the
      # former Supabase deploy guard). Destructive changes need a deliberate, reviewed rewrite.
      - name: Lint database migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(db/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations found, nothing to lint."
            exit 0
          fi

          patterns=(
            'drop[[:space:]]+table'
            'drop[[:space:]]+schema'
            'drop[[:space:]]+database'
            'drop[[:space:]]+column'
            'drop[[:space:]]+role'
            'drop[[:space:]]+policy'
            'truncate[[:space:]]'
            'alter[[:space:]]+table[[:space:]]+[^;]*drop[[:space:]]'
            'delete[[:space:]]+from'
          )

          fail=0
          for f in "${files[@]}"; do
            for p in "${patterns[@]}"; do
              if grep -inE "$p" "$f" >/dev/null; then
                echo "::error file=$f::Destructive pattern matched: $p"
                grep -inE "$p" "$f" || true
                fail=1
              fi
            done
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::Migration lint failed. Destructive operations are blocked by policy."
            exit 1
          fi

  # The unit and API tests run in four shards (#490: two shards were over their budget again; #634: with three, runner speed varied 1.8x and 5 of 90 shard jobs ran over 52 s) (vitest --shard), each under its own time budget.
  # Each shard builds too: some tests read dist/ and build-info.
  unit-shard:
    name: Unit tests shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit and API tests (time budget, shard ${{ matrix.shard }}/4)
        run: npm run test:budget -- --shard=${{ matrix.shard }}/4

  # The check that branch protection reads. It never skips: a skipped need counts as passing,
  # so it runs on every outcome and fails unless every needed job succeeded.
  unit:
    name: Unit tests (vitest)
    needs: [checks, unit-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed
        env:
          CHECKS: ${{ needs.checks.result }}
          SHARDS: ${{ needs.unit-shard.result }}
        run: |
          echo "checks: $CHECKS, unit shards: $SHARDS"
          if [ "$CHECKS" != "success" ] || [ "$SHARDS" != "success" ]; then
            echo "::error::A needed job did not succeed"
            exit 1
          fi

  smoke-local:
    name: Smoke test against the local API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the local headless API
        run: |
          npm run dev:api > dev-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "::error::Local API did not start"; cat dev-api.log; exit 1

      - name: Run the smoke test
        run: |
          set -euo pipefail
          token=$(curl -fsS -X POST http://127.0.0.1:8787/api/dev/token \
            -H 'content-type: application/json' -d '{"login":"ci-smoke"}' | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).token")
          echo "::add-mask::$token"
          XT_BASE_URL=http://127.0.0.1:8787 XT_TOKEN="$token" npm run smoke

  # E2E runs in three shards (#470: the single job was the slowest CI job, 2 min 6 s of a 2 min 9 s run).
  e2e-shard:
    name: E2E tests shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # No --with-deps: the runner already has every Chromium library. --with-deps ran apt-get and
      # installed fonts on every run (slow on slow mirror days, #216, #262, #268).
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ matrix.shard }}
          path: test-results/ui-audit
          retention-days: 14

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens-${{ matrix.shard }}
          path: test-results/screens
          retention-days: 14
          if-no-files-found: ignore

  # The check that branch protection reads for E2E (same name as before the shards). It never skips.
  e2e:
    name: E2E tests (playwright)
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e shards: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::An E2E shard did not succeed"
            exit 1
          fi

  screens:
    name: UI screenshots (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app and start the local servers
        run: |
          npm run build
          npm run dev:api > api.log 2>&1 &
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && curl -sf -o /dev/null -XPOST http://127.0.0.1:4173/api/dev/token -H 'content-type: application/json' -d '{"login":"ci-probe"}' && break
            sleep 1
          done

      - name: Capture screens
        env:
          XT_BASE_URL: http://127.0.0.1:4173
        run: npm run screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: test-results/screens
