name: Janitor (weekly, read-only)

# Task J2 (#461). Runs the task janitor's pass 1 (issues) with no model and posts the report as ONE comment
# on the Janitor reports issue (task-janitor.reportIssue in .claude/agent-kit.json, #497).
# It changes nothing else: no close, no label, no edit, no delete. The allowed safe fixes need a reader of each
# HANDOFF, so they stay in the /janitor command (pass 2 needs Claude session tools, also /janitor).
# Comments are not loaded here, so the report says which issues need them read.
#
# Turn it off: set the repository variable JANITOR_AUTO to `off` (or false; any case), or disable the workflow in the Actions tab.
# Manual run: Actions tab, "Janitor (weekly, read-only)", Run workflow. `dry_run` prints the report and posts nothing.
# See docs/operations/task-janitor.md.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the report (post nothing).'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: janitor-weekly
  cancel-in-progress: false

jobs:
  janitor:
    name: Janitor pass 1 (read-only)
    # Off switch: JANITOR_AUTO set to off or false (any case: != compares strings case-insensitively). Not `0`, and not
    # contains(): an unset variable is loosely equal to "0", so that skipped every run. A schedule run always uses the default branch
    # (and its event has no `repository`), so only a manual run is checked for the branch.
    if: >-
      vars.JANITOR_AUTO != 'off' && vars.JANITOR_AUTO != 'false' &&
      (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Snapshot and report (GitHub search only)
        run: |
          set -euo pipefail
          node scripts/janitor.mjs fetch > "$RUNNER_TEMP/snapshot.json"
          node scripts/janitor.mjs report "$RUNNER_TEMP/snapshot.json" > "$RUNNER_TEMP/report.md"
          # One comment stays under GitHub's limit: keep whole lines up to 60 000 bytes, close an open code block, say so.
          if [ "$(wc -c < "$RUNNER_TEMP/report.md")" -gt 60000 ]; then
            head -c 60000 "$RUNNER_TEMP/report.md" | sed '$d' > "$RUNNER_TEMP/cut.md"
            if [ $(( $(grep -c '^```' "$RUNNER_TEMP/cut.md") % 2 )) -eq 1 ]; then printf '```\n' >> "$RUNNER_TEMP/cut.md"; fi
            printf '\n(Cut at 60 000 bytes. Run /janitor for the full report.)\n' >> "$RUNNER_TEMP/cut.md"
            mv "$RUNNER_TEMP/cut.md" "$RUNNER_TEMP/report.md"
          fi
          {
            printf '## TL;DR\nThe weekly janitor read the open issues (pass 1 only) and changed nothing.\nNothing needed from you unless a finding below says `owner`.\n\n'
            printf '## What you need to do\nNothing.\n\n## Waiting for\nNothing.\n\n## Blocked on you\nNothing.\n\n'
            printf '## Done\n- Pass 1 report read and posted (checked: script output, reply-style lint).\n\n## Details\n'
            cat "$RUNNER_TEMP/report.md"
            printf '\n---\n_Posted by the weekly janitor workflow (no model)._\n'
          } > "$RUNNER_TEMP/comment.md"
          mv "$RUNNER_TEMP/comment.md" "$RUNNER_TEMP/report.md"
          wc -c "$RUNNER_TEMP/report.md"

      - name: Lint the report (reply-style)
        run: node plugins/reply-style/scripts/reply-lint.mjs --template --config .claude/agent-kit.json "$RUNNER_TEMP/report.md"

      - name: Post it on the reports issue
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          ISSUE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.claude/agent-kit.json','utf8'))['task-janitor'].reportIssue)")
          case "$ISSUE" in ''|*[!0-9]*) echo "reportIssue is not a number"; exit 1;; esac
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/report.md"

      - name: Print the report (dry run)
        if: env.DRY_RUN == 'true'
        run: cat "$RUNNER_TEMP/report.md"
