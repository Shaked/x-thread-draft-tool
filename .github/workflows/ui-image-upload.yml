name: UI image upload test

# Runs tests/e2e/image-upload.spec.ts automatically after every successful PREVIEW deployment,
# against that deployment's URL. Production is excluded: the test writes a draft (then deletes it),
# so it never runs against production without a human decision.
# Also runnable by hand (workflow_dispatch) against any https URL.
# Needs the repository secret XT_UI_SESSION: the xt_session cookie value of a signed-in user.
# The run fails (not skips) when the secret is missing.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployment URL to test, for example https://x-thread-draft-tool-git-cl-0b0232-shaked-klein-orbachs-projects.vercel.app'
        required: true
        type: string

permissions:
  contents: read

jobs:
  image-upload:
    name: Image upload (UI)
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment != 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Check inputs
        env:
          BASE_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || inputs.base_url }}
          XT_SESSION: ${{ secrets.XT_UI_SESSION }}
        run: |
          set -euo pipefail
          if [ -z "$XT_SESSION" ]; then
            echo "::error::Repository secret XT_UI_SESSION is not set. The test would be skipped, so the run is failed."
            exit 1
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::base URL must start with https://"; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run image upload test
        env:
          XT_BASE_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || inputs.base_url }}
          XT_SESSION: ${{ secrets.XT_UI_SESSION }}
        run: npx playwright test tests/e2e/image-upload.spec.ts --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-upload-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore
