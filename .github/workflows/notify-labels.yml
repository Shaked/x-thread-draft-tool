name: Notify labels (Telegram)

# Telegram notices for two labels (epic #241, task N2): `try-preview` on a PR and `owner` on an
# issue or PR. Only a label added by the repository owner sends (scripts/notify-label.mjs).
#
# Safety: this workflow never checks out or runs code from a PR branch. It checks out the default
# branch and runs the script from there; the event values reach the script only as environment
# variables. Only users with write access can add labels, and the owner check is explicit.
# Without the two secrets the script prints a skip line and the job stays green.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  notify:
    name: Telegram label notice
    if: github.event.label.name == 'try-preview' || github.event.label.name == 'owner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The title and URL are user-controlled text: they only ever enter as environment variables.
      - name: Send the label notice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LABEL_NAME: ${{ github.event.label.name }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          OWNER_LOGIN: ${{ github.repository_owner }}
          TARGET_IS_PR: ${{ github.event.pull_request && 'true' || 'false' }}
          TARGET_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          TARGET_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
        run: node scripts/notify-label.mjs
